name: Release

on:
  push:
    branches:
      - main
      - dev

permissions:
  contents: write       # push version-bump commit + tag
  issues: write         # link issues in release notes
  pull-requests: write  # link PRs in release notes

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history so semantic-release can read all commits

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
